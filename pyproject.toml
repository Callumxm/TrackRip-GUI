description = "A desktop application for downloading audio from YouTube videos and playlists."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PySide6",
    "yt-dlp",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest",
]

[tool.uv]
package = false
